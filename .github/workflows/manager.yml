name: OpenSSH Server PN Manager

# The same tested artifact is consumed by the product MSI and standalone manager release.
# Compiler and .NET reference packages are pinned by SHA-256 in build-toolchain.json.
on:
  push:
    branches: [main]
    paths: ['tools/OpenSSH-Server-PN-Manager/**', '.github/workflows/manager.yml', '.github/scripts/**']
    tags: ['manager-v*']
  pull_request:
    paths: ['tools/OpenSSH-Server-PN-Manager/**', '.github/workflows/manager.yml', '.github/scripts/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  test:
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a supported signing method for release tags
        if: github.ref_type == 'tag'
        env:
          SIGNING_METHOD: ${{ vars.SIGNING_METHOD }}
        run: |
          if ($env:SIGNING_METHOD -notin 'trusted-signing', 'pfx') {
            throw 'Release tags require SIGNING_METHOD=trusted-signing or pfx and the corresponding signing credentials. Branch builds remain unsigned.'
          }
          if ($env:GITHUB_REF_NAME.StartsWith('manager-v')) {
            $version = (Select-String -Path tools/OpenSSH-Server-PN-Manager/Program.cs -Pattern 'AppVersion = "([^"]+)"').Matches[0].Groups[1].Value
            if ($env:GITHUB_REF_NAME -ne "manager-v$version") { throw 'The manager tag does not match the source version.' }
          }

      - name: Build twice, enforce reproducibility and test fresh bytes
        run: ./.github/scripts/Test-ManagerBuild.ps1 -OutDir "$env:RUNNER_TEMP/manager"

      - name: Sign manager (Azure Artifact Signing)
        if: vars.SIGNING_METHOD == 'trusted-signing' && github.ref_type == 'tag'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ runner.temp }}\manager\OpenSSHServerPNManager.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: OpenSSH Server PN Manager
          description-url: https://github.com/${{ github.repository }}
          cache-dependencies: false

      - name: Sign manager (certificate file)
        if: vars.SIGNING_METHOD == 'pfx' && github.ref_type == 'tag'
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          SIGNING_TIMESTAMP_URL: ${{ vars.SIGNING_TIMESTAMP_URL }}
          SIGNING_TRUSTED_ROOT_BASE64: ${{ vars.SIGNING_TRUSTED_ROOT_BASE64 }}
        run: ./.github/scripts/Invoke-Signtool.ps1 -Path "$env:RUNNER_TEMP/manager/OpenSSHServerPNManager.exe" -Description 'OpenSSH Server PN Manager'

      - name: Verify and test the signed release executable
        if: github.ref_type == 'tag'
        env:
          SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNING_CERTIFICATE_THUMBPRINT }}
        run: |
          ./.github/scripts/Test-Authenticode.ps1 -Path "$env:RUNNER_TEMP/manager/OpenSSHServerPNManager.exe"
          ./.github/scripts/Test-ManagerBuild.ps1 -OutDir "$env:RUNNER_TEMP/manager" -TestOnly

      - name: Upload manager test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-test-evidence
          path: |
            ${{ runner.temp }}/manager/unittest.txt
            ${{ runner.temp }}/manager/ui/
          if-no-files-found: ignore
          retention-days: 14

      - name: Hash the final tested artifact
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'manager'
          $sums = 'OpenSSHServerPNManager.exe', 'OpenSSHServerPNManager.exe.config', 'build-info.json' | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash (Join-Path $dir $_) -Algorithm SHA256).Hash.ToLowerInvariant(), $_
          }
          [IO.File]::WriteAllText((Join-Path $dir 'SHA256SUMS.txt'), ($sums -join "`n") + "`n")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-tested
          path: ${{ runner.temp }}/manager/
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/manager-v')
    needs: test
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manager-tested
          path: dist

      - name: Check final artifact hashes
        shell: bash
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Attest the tested files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/OpenSSHServerPNManager.exe
            dist/OpenSSHServerPNManager.exe.config
            dist/build-info.json
            dist/SHA256SUMS.txt

      - name: Create reviewable draft from the tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:TAG dist/OpenSSHServerPNManager.exe dist/OpenSSHServerPNManager.exe.config dist/build-info.json dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --draft --verify-tag --latest=false --title "OpenSSH Server PN Manager $($env:TAG.Substring('manager-v'.Length))" --notes 'Built reproducibly from pinned inputs, Authenticode signed, and tested before publication. Compare SHA256SUMS.txt; build-info.json records the unsigned deterministic build inputs and hashes.'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
