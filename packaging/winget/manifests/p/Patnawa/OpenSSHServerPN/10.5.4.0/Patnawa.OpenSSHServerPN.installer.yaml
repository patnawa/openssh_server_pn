# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
# The three MSIs of the release v10.5.4.0. InstallerSha256: the hashes in the README and SHA256SUMS.txt,
# checked against the downloaded files. ProductCode: read from each MSI's Property table (a new one for every
# build, Product Id="*"). The UpgradeCode is left out on purpose: the packages share the upgrade codes of
# Microsoft's OpenSSH packages (so that they replace them), and winget would match those installations too.

PackageIdentifier: Patnawa.OpenSSHServerPN
PackageVersion: 10.5.4.0
InstallerLocale: en-US
MinimumOSVersion: 10.0.0.0
InstallerType: msi
Scope: machine
InstallModes:
- interactive
- silent
- silentWithProgress
InstallerSwitches:
  # The MSI's install folder property is INSTALLFOLDER; winget's default for MSIs (TARGETDIR) has no effect.
  InstallLocation: INSTALLFOLDER="<INSTALLPATH>"
UpgradeBehavior: install
# A per-machine MSI run silently cannot ask for elevation itself (it fails with error 1925).
ElevationRequirement: elevationRequired
Commands:
- scp
- sftp
- ssh
- ssh-add
- ssh-agent
- ssh-keygen
- ssh-keyscan
- sshd
